<h2 mat-dialog-title>Nova vacina</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <div class="vaccine-form">
      <app-text-input label="Nome" [control]="form.controls.name" [errorMessages]="nameErrors" />

      <div class="vaccine-form__scheme">
        <app-number-input
          label="Doses primárias"
          [min]="1"
          [max]="10"
          [control]="form.controls.primaryDoses"
          [errorMessages]="primaryDosesErrors"
        />
        <app-number-input
          label="Doses de reforço"
          [min]="0"
          [max]="5"
          [control]="form.controls.boosterDoses"
          [errorMessages]="boosterDosesErrors"
        />
      </div>

      <p class="vaccine-form__hint">O esquema de doses não pode ser alterado depois do cadastro.</p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" mat-dialog-close [disabled]="loading()">Cancelar</button>
    <app-submit-button label="Cadastrar" [loading]="loading()" />
  </mat-dialog-actions>
</form>
