<h2 mat-dialog-title>Corrigir data de aplicação</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <div class="applied-on-form">
      <p class="applied-on-form__dose">{{ data.vaccineName }} · {{ data.doseLabel }}</p>
      <app-date-input
        label="Data de aplicação"
        [control]="form.controls.appliedOn"
        [errorMessages]="appliedOnErrors"
      />
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" mat-dialog-close [disabled]="loading()">Cancelar</button>
    <app-submit-button label="Corrigir" [loading]="loading()" />
  </mat-dialog-actions>
</form>
