<div class="main" [class.main--handset]="isHandset()">
  @if (!isHandset()) {
    <app-side-nav [items]="navItems" (signOut)="signOut()" />
  }

  <main class="main__content">
    <router-outlet />
  </main>

  @if (isHandset()) {
    <app-bottom-nav [items]="navItems" (signOut)="signOut()" />
  }
</div>
