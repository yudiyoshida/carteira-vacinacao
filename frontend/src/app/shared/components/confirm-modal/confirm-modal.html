<h2 mat-dialog-title>{{ data.heading }}</h2>

<mat-dialog-content [id]="messageId">{{ data.message }}</mat-dialog-content>

<!-- "Cancelar" comes first: the dialog focuses the first button, so Enter does not confirm. -->
<mat-dialog-actions align="end">
  <button matButton type="button" mat-dialog-close>Cancelar</button>
  <button class="confirm-modal__confirm" matButton="filled" type="button" [mat-dialog-close]="true">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
