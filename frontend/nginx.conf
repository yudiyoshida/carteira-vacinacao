# Without the query string, because a search term can be a person's name (RN25).
log_format no_query_string '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log no_query_string;

    location /api/ {
        # The Docker DNS finds the API again when its container gets another IP.
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8080;
        proxy_pass $api;

        # Keeps the port: the Location of a 201 comes from this header.
        proxy_set_header Host $http_host;
        # Replaces the value sent by the client, so that nobody forges the IP of the login limit (RN24).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The upstream errors carry the query string (RN25); the access log still shows the 502.
        error_log /var/log/nginx/error.log crit;
    }

    location / {
        try_files $uri /index.html;

        # Only here, because the API responses carry tokens (BREACH, TechSpec §9).
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml image/x-icon;

        # Only here, because the API sends the same headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
